<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>External Player configuration preview</title>
    <style>
        :root {
            --background-hue: 240;
            --background-saturation: 3.4%;
            --background-lightness: 11.4%;
            --button-background-hue: 240;
            --button-background-saturation: 5.1%;
            --button-background-lightness: 20%;
            --button-background-alpha: .8;
            --theme-primary-color-hue: 116;
            --theme-primary-color-saturation: 41.7%;
            --theme-primary-color-lightness: 50.2%;
            --theme-text-color-hue: 0;
            --theme-text-color-saturation: 0%;
            --theme-text-color-lightness: 100%;
            --theme-text-color-alpha: 1;
            --theme-secondary-text-color-alpha: .62;
            --line-background: rgba(255,255,255,.16);
        }
        * { box-sizing: border-box; }
        body { background:#111; color:#fff; font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; }
        .settingsContainer { padding:2rem; }
        form, .readOnlyContent { max-width:80ch; }
        .auto-center { margin-inline:auto; }
        .mainSubTitle { color:rgba(255,255,255,.62); margin-bottom:1.5rem; }
        .verticalSection { margin-bottom:1.5rem; }
        .fieldDescription { color:rgba(255,255,255,.62); }
        .emby-button, .raised { background:rgba(255,255,255,.14); border:0; border-radius:.35rem; color:#fff; padding:.7rem 1rem; }
        .button-submit { background:hsl(116,41.7%,50.2%); }
        .emby-input, .emby-select { background:rgba(255,255,255,.12); border:1px solid transparent; border-radius:.3rem; color:#fff; min-height:2.8rem; padding:.55rem .7rem; }
        .emby-select option { color:#000; }
        .inputLabel { display:block; font-size:.86rem; margin-bottom:.35rem; }
        .genericeditbutton-hide { display:none; }
    </style>
</head>
<body>
    <div class="settingsContainer">
        <h1>外部播放器</h1>
        <div class="mainSubTitle">隔离的插件配置页预览。</div>
        <form class="dashboardGeneralForm auto-center readOnlyContent">
            <div class="mainContentParent">
                <div class="mainContent">
                    <div class="verticalSection">
                        <label><input type="checkbox" checked> 启用插件</label>
                    </div>
                </div>
                <div class="verticalSection">
                    <button type="submit" data-data1="PageSave" class="raised button-submit block btnSave pagebutton"><span>Save</span></button>
                </div>
            </div>
        </form>
    </div>
    <script>
        window.location.hash = "#!/genericui?PageId=f7e75c%3ASettings&preview=1";
        const players = [{
            Id: "preview-iina-nova",
            Enabled: true,
            ApplicationName: "IINA Nova",
            Platform: "MacOS",
            UrlTemplate: "iina-nova://weblink?url={url}&new_window=1&mpv_start={start}"
        }];
        const events = { on() {}, off() {} };
        const apiClient = {
            getUrl(path, query) {
                return path === "ExternalPlayer/Web/style.css"
                    ? `../../src/Emby.ExternalPlayer/Resources/external-player.css?v=${query.v}`
                    : path;
            },
            getJSON() { return Promise.resolve(players); },
            ajax(options) {
                if (options.type === "DELETE") return Promise.resolve({ Deleted: true });
                const value = JSON.parse(options.data);
                return Promise.resolve({ ...value, Id: value.id || `preview-${Date.now()}` });
            }
        };
        const connectionManager = { currentApiClient() { return apiClient; } };
        window.define = function (_dependencies, factory) {
            factory(events, connectionManager)();
        };
    </script>
    <script src="../../src/Emby.ExternalPlayer/Resources/external-player.js?v=1.4.3"></script>
</body>
</html>
