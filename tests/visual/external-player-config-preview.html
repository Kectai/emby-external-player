<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>External Player configuration preview</title>
    <style>
        :root {
            --background-hue: 240;
            --background-saturation: 3.4%;
            --background-lightness: 11.4%;
            --button-background-hue: 240;
            --button-background-saturation: 5.1%;
            --button-background-lightness: 20%;
            --button-background-alpha: .8;
            --theme-primary-color-hue: 116;
            --theme-primary-color-saturation: 41.7%;
            --theme-primary-color-lightness: 50.2%;
            --theme-text-color-hue: 0;
            --theme-text-color-saturation: 0%;
            --theme-text-color-lightness: 100%;
            --theme-text-color-alpha: 1;
            --theme-secondary-text-color-alpha: .62;
            --line-background: rgba(255,255,255,.16);
        }
        * { box-sizing: border-box; }
        body { background:#111; color:#fff; font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; }
        .settingsContainer { padding:2rem; }
        form, .readOnlyContent { max-width:80ch; }
        .auto-center { margin-inline:auto; }
        .mainSubTitle { color:rgba(255,255,255,.62); margin-bottom:1.5rem; }
        .verticalSection { margin-bottom:1.5rem; }
        .fieldDescription { color:rgba(255,255,255,.62); }
        .emby-button, .raised { background:rgba(255,255,255,.14); border:0; border-radius:.35rem; color:#fff; padding:.7rem 1rem; }
        .button-submit { background:hsl(116,41.7%,50.2%); }
        .emby-input { background:rgba(255,255,255,.12); border:1px solid transparent; border-radius:.3rem; color:#fff; display:block; height:3em; margin:0 0 0!important; padding:0 1ch; width:100%; }
        .emby-select { appearance:none; background:rgba(255,255,255,.12); border:1px solid transparent; border-radius:.3rem; color:#fff; display:block; height:100%; margin:0 0 0!important; padding:0 1ch; width:100%; }
        .inputContainer { margin-bottom:1.5em; }
        .emby-select option { color:#000; }
        .inputLabel { display:block; font-size:.86rem; margin-bottom:.35rem; }
        .genericeditbutton-hide { display:none; }
        #previewStatus { display:none; }
    </style>
</head>
<body>
    <div class="settingsContainer">
        <h1>外部播放器</h1>
        <div class="mainSubTitle">隔离的插件配置页预览。</div>
        <form class="dashboardGeneralForm auto-center readOnlyContent">
            <div class="mainContentParent">
                <div class="mainContent">
                    <div class="verticalSection">
                        <label><input type="checkbox" checked> 启用插件</label>
                    </div>
                </div>
                <div class="verticalSection">
                    <button type="submit" data-data1="PageSave" class="raised button-submit block btnSave pagebutton"><span>Save</span></button>
                </div>
            </div>
        </form>
    </div>
    <output id="previewStatus"></output>
    <script>
        window.addEventListener("error", function (event) {
            document.getElementById("previewStatus").textContent = "ERROR: " + event.message;
        });
        window.addEventListener("unhandledrejection", function (event) {
            document.getElementById("previewStatus").textContent = "REJECTION: " + String(event.reason);
        });
        window.location.hash = "#!/genericui?PageId=f7e75c%3ASettings&preview=1";
        const players = [{
            Id: "preview-iina-nova",
            Enabled: true,
            ApplicationName: "IINA Nova",
            Platform: "MacOS",
            Platforms: ["MacOS", "IOS"],
            UrlTemplate: "iina-nova://weblink?url={url}&new_window=1&mpv_start={start}&mpv_sub-file={subtitle}&mpv_http-header-fields={headers}"
        }];
        const builtInPlayers = [
            { PlayerId: "PotPlayer", DisplayName: "PotPlayer", Enabled: true, Platforms: ["Windows"] },
            { PlayerId: "Iina", DisplayName: "IINA", Enabled: true, Platforms: ["MacOS"] },
            { PlayerId: "Vlc", DisplayName: "VLC media player", Enabled: true, Platforms: ["Windows", "MacOS", "IOS", "Android", "Linux"] },
            { PlayerId: "Infuse", DisplayName: "Infuse", Enabled: true, Platforms: ["MacOS", "IOS"] },
            { PlayerId: "Mpv", DisplayName: "mpv", Enabled: false, Platforms: ["Windows", "MacOS", "Linux"] },
            { PlayerId: "NPlayer", DisplayName: "nPlayer", Enabled: false, Platforms: ["IOS", "Android"] }
        ];
        const configurationStrings = {
            BuiltInPlayers: "内置播放器",
            BuiltInPlayersDescription: "设置每个内置播放器的启用状态和适用平台；管理员默认播放器必须保持启用并包含对应平台。",
            PlayerPlatformsLoadError: "无法加载适用平台。",
            PlayerPlatformsSaveError: "无法保存；请至少选择一个平台，并保留管理员默认播放器的对应平台。",
            CustomPlayers: "自定义播放器",
            CustomPlayersDescription: "自定义播放器在下方独立管理，可一次添加多个草稿，每个播放器都有自己的保存和删除操作。应用名称按输入原样显示；模板支持 {url}、{title}、{subtitle}、{start} 和 {headers}。",
            CustomPlayerAdd: "添加播放器",
            CustomPlayerEnabled: "启用",
            ApplicationName: "官方应用名称",
            Platform: "适用平台",
            PlatformDescription: "选择此播放器的适用平台，可多选。",
            UrlTemplate: "URL Scheme 模板",
            EnablePlaybackReporting: "启用播放进度回传",
            EnablePlaybackReportingDescription: "URL 模板必须包含 {headers}，且播放器中需安装兼容、可信的回传插件。",
            SaveCustomPlayer: "保存此播放器",
            Delete: "删除",
            Saved: "已保存",
            UnsavedChanges: "有未保存的更改",
            Deleted: "已删除",
            CustomPlayersLoadError: "无法加载自定义播放器配置。",
            CustomPlayerSaveError: "无法保存，请检查应用名称和 URL 模板。",
            CustomPlayerDeleteError: "无法删除这个自定义播放器。",
            CustomPlayerDeleteConfirm: "确定删除这个自定义播放器吗？"
        };
        const events = { on() {}, off() {} };
        const apiClient = {
            getCurrentUserId() { return "visual-user"; },
            serverId() { return "visual-server"; },
            getUrl(path, query) {
                return path === "ExternalPlayer/Web/style.css"
                    ? `../../src/Emby.ExternalPlayer/Resources/external-player.css?v=${query?.v || "1.7.4"}`
                    : path;
            },
            getJSON(url) {
                return Promise.resolve(String(url).includes("BuiltInPlayerPlatforms")
                    ? builtInPlayers
                    : players);
            },
            ajax(options) {
                if (options.type === "DELETE") return Promise.resolve({ Deleted: true });
                const value = JSON.parse(options.data);
                return Promise.resolve({ ...value, Id: value.id || `preview-${Date.now()}` });
            }
        };
        const connectionManager = { currentApiClient() { return apiClient; } };
        const languageModule = {
            translate(_key, fallback) { return fallback; },
            getCachedConfigurationStrings() { return configurationStrings; }
        };
        window.define = function (_dependencies, factory) {
            factory(languageModule, events, connectionManager)();
        };
    </script>
    <script src="../../src/Emby.ExternalPlayer/Resources/external-player.js?v=1.7.4"></script>
    <script>
        window.setTimeout(function () {
            if (!document.getElementById("embyExternalPlayerCustomPlayers")) {
                document.getElementById("previewStatus").textContent = "Configuration editor was not injected";
            }
        }, 750);
    </script>
</body>
</html>
